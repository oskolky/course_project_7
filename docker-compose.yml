version: '3.8'

services:
  app:
    build: ..
    ports:
      - "3000:3000"
    volumes:
      - log-analyzer-data:/app/data
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/log_analyzer
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: log_analyzer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  log-analyzer-data:
  postgres-data: