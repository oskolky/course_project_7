rules:
  # title и recommendation_text — необязательные поля представления: на выводы они
  # не влияют и выводятся в интерфейсе вместо служебных идентификаторов.
  - id: AUTH_ISSUER_MISMATCH
    version: 1
    scope: group
    when:
      template_contains: "unexpected issuer"
      status_in: [401]
      related_events_gte: 2
    then:
      hypothesis: authentication_issuer_mismatch
      severity: high
      recommendation: compare_token_issuer_configuration
      evidence: [request_id, route, status, template_id]
      title: Несовпадение издателя токена при аутентификации
      recommendation_text: Сверить издателя токенов (issuer) в конфигурации сервиса аутентификации и в приложении.
  - id: UPSTREAM_TIMEOUT
    version: 1
    scope: group
    when:
      message_contains: "upstream timed out"
      status_in: [504]
      related_events_gte: 2
    then:
      hypothesis: upstream_timeout
      severity: high
      recommendation: inspect_upstream_health_and_timeout_settings
      evidence: [request_id, route, status, template_id]
      title: Тайм-аут ответа вышестоящего сервера (upstream)
      recommendation_text: Проверить доступность и время ответа upstream, а также настройки тайм-аутов веб-сервера.
